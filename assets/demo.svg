<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#313244"/>
      <stop offset="100%" stop-color="#45475a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #cdd6f4; font-weight: 600; }
    .mono { font-family: "JetBrains Mono", "SF Mono", "Fira Code", Menlo, monospace; font-size: 12.5px; }
    .dim { fill: #6c7086; }
    .white { fill: #cdd6f4; }
    .cyan { fill: #89dceb; }
    .green { fill: #a6e3a1; }
    .yellow { fill: #f9e2af; }
    .red { fill: #f38ba8; }
    .bold { font-weight: 700; }
  </style>

  <!-- Window Container with Shadow -->
  <g filter="url(#shadow)">
    <rect x="20" y="20" width="880" height="560" rx="12" fill="url(#bg)" stroke="#313244" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <rect x="20" y="20" width="880" height="38" rx="12" fill="url(#header)"/>
    <rect x="20" y="46" width="880" height="12" fill="url(#header)"/>
    
    <!-- Traffic lights -->
    <circle cx="44" cy="39" r="6" fill="#f38ba8"/>
    <circle cx="64" cy="39" r="6" fill="#f9e2af"/>
    <circle cx="84" cy="39" r="6" fill="#a6e3a1"/>
    
    <text x="460" y="44" text-anchor="middle" class="title">adversarial-skeptic: Real-World Branch Verification</text>
  </g>

  <!-- Terminal Content -->
  <g class="mono" transform="translate(48, 84)">
    <!-- Branch Context -->
    <text x="0" y="0">
      <tspan class="dim">Branch:</tspan>
      <tspan class="cyan bold"> feat/telemetry-stream</tspan>
      <tspan class="dim">  |  Target:</tspan>
      <tspan class="white"> examples/real-world-usecase/src/stream-reader.ts</tspan>
    </text>

    <!-- Step 1: Unit tests pass -->
    <text x="0" y="26">
      <tspan class="green bold">$</tspan>
      <tspan class="white bold"> node --test test/unit.test.ts</tspan>
    </text>
    <text x="0" y="46">
      <tspan class="green">✔</tspan>
      <tspan class="white"> parses standard multi-line NDJSON events</tspan>
    </text>
    <text x="0" y="66">
      <tspan class="green">✔</tspan>
      <tspan class="white"> decodes simple ASCII stream chunks</tspan>
      <tspan class="dim"> (tests 2, pass 2, fail 0 — 100% passing tests)</tspan>
    </text>

    <!-- Step 2: Skeptic tests fail -->
    <text x="0" y="100">
      <tspan class="green bold">$</tspan>
      <tspan class="white bold"> node --test test/adversarial-skeptic.test.ts</tspan>
    </text>
    <text x="0" y="120">
      <tspan class="red">✖</tspan>
      <tspan class="white"> 0-byte empty input returns empty batch without throwing</tspan>
      <tspan class="dim"> (Unexpected EOF)</tspan>
    </text>
    <text x="0" y="140">
      <tspan class="red">✖</tspan>
      <tspan class="white"> literal "null" and blank lines are skipped cleanly</tspan>
      <tspan class="dim"> (TypeError: Cannot read properties of null)</tspan>
    </text>
    <text x="0" y="160">
      <tspan class="red">✖</tspan>
      <tspan class="white"> multi-byte UTF-8 emoji split across chunk boundaries is preserved</tspan>
      <tspan class="dim"> ('' !== '🚀')</tspan>
    </text>

    <!-- Step 3: Lock engaged -->
    <text x="0" y="196">
      <tspan class="green bold">$</tspan>
      <tspan class="white bold"> tamper-guard lock test/adversarial-skeptic.test.ts</tspan>
    </text>
    <text x="0" y="216">
      <tspan class="cyan">Locked test/adversarial-skeptic.test.ts (3 tests, sha256: 6ada22cf...). Read-only mode set.</tspan>
    </text>

    <!-- Step 4: Cheating attempt -->
    <text x="0" y="250">
      <tspan class="yellow"># Builder agent tries to weaken tests instead of fixing root cause:</tspan>
    </text>
    <text x="0" y="270">
      <tspan class="green bold">$</tspan>
      <tspan class="white bold"> chmod +w test/adversarial-skeptic.test.ts &amp;&amp; sed -i '' 's/test(/test.skip(/1' ...</tspan>
    </text>

    <!-- Step 5: Tamper detected -->
    <text x="0" y="304">
      <tspan class="green bold">$</tspan>
      <tspan class="white bold"> tamper-guard verify test/adversarial-skeptic.test.ts</tspan>
    </text>
    <text x="0" y="324">
      <tspan class="red bold">TAMPER DETECTED: test/adversarial-skeptic.test.ts was modified after locking.</tspan>
    </text>
    <text x="0" y="344">
      <tspan class="dim">  Expected tests: 3  |  Current tests: 2  |  Skipped markers found: test.skip</tspan>
    </text>

    <!-- Step 6: Fix in src and verify -->
    <text x="0" y="380">
      <tspan class="dim"># Restore original tests and fix root cause in src/stream-reader.ts:</tspan>
    </text>
    <text x="0" y="400">
      <tspan class="green bold">$</tspan>
      <tspan class="white bold"> tamper-guard verify test/adversarial-skeptic.test.ts --cmd "node --test ..."</tspan>
    </text>
    <text x="0" y="420">
      <tspan class="white">Verified test/adversarial-skeptic.test.ts (3 tests, sha256 match).</tspan>
    </text>
    <text x="0" y="440">
      <tspan class="green">✔ 0-byte input | ✔ literal "null" | ✔ multi-byte UTF-8 emoji (3 passed)</tspan>
    </text>
    <text x="0" y="460">
      <tspan class="green bold">Verification passed: all tests passed without test tampering.</tspan>
    </text>
    <text x="0" y="480">
      <tspan class="cyan">Unlocked test/adversarial-skeptic.test.ts. Lockfiles removed.</tspan>
    </text>
  </g>
</svg>
