<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#313244"/>
      <stop offset="100%" stop-color="#45475a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #cdd6f4; font-weight: 600; }
    .mono { font-family: "JetBrains Mono", "SF Mono", "Fira Code", Menlo, monospace; font-size: 13px; line-height: 20px; }
    .dim { fill: #6c7086; }
    .white { fill: #cdd6f4; }
    .cyan { fill: #89dceb; font-weight: 600; }
    .green { fill: #a6e3a1; font-weight: 600; }
    .yellow { fill: #f9e2af; }
    .red { fill: #f38ba8; font-weight: 600; }
    .bold { font-weight: 700; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 700; }
  </style>

  <!-- Window Container with Shadow -->
  <g filter="url(#shadow)">
    <rect x="20" y="20" width="880" height="500" rx="12" fill="url(#bg)" stroke="#313244" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <rect x="20" y="20" width="880" height="38" rx="12" fill="url(#header)"/>
    <rect x="20" y="46" width="880" height="12" fill="url(#header)"/>
    
    <!-- Traffic lights -->
    <circle cx="44" cy="39" r="6" fill="#f38ba8"/>
    <circle cx="64" cy="39" r="6" fill="#f9e2af"/>
    <circle cx="84" cy="39" r="6" fill="#a6e3a1"/>
    
    <text x="460" y="44" text-anchor="middle" class="title">tamper-guard: Tamper Protection Simulation</text>
  </g>

  <!-- Terminal Content -->
  <g class="mono" transform="translate(48, 86)">
    <!-- Command -->
    <text x="0" y="0">
      <tspan class="green bold">$</tspan>
      <tspan class="white bold"> npm run demo</tspan>
    </text>

    <!-- Step 1: Lock -->
    <text x="0" y="26">
      <tspan class="cyan">[1/5] Locking test suite</tspan>
    </text>
    <text x="20" y="48">
      <tspan class="white">Locked test/adversarial-skeptic.test.ts (11 tests, sha256: e8b28f1025...). Read-only mode set.</tspan>
    </text>

    <!-- Step 2: Builder Bypasses -->
    <text x="0" y="86">
      <tspan class="yellow">[2/5] Simulating test tampering (skipping tests and deleting assertions)</tspan>
    </text>
    <text x="20" y="108">
      <tspan class="dim">Action: chmod +w test/adversarial-skeptic.test.ts, added test.skip, deleted test assertion</tspan>
    </text>

    <!-- Step 3: Tamper Detected -->
    <text x="0" y="146">
      <tspan class="red">[3/5] Running verification on modified suite</tspan>
    </text>
    <text x="20" y="168">
      <tspan class="red">TAMPER DETECTED: test/adversarial-skeptic.test.ts was modified after locking.</tspan>
    </text>
    <text x="20" y="190">
      <tspan class="dim">Result: exited with code 1 (tamper detected)</tspan>
    </text>

    <!-- Step 4: Forgery Detected -->
    <text x="0" y="228">
      <tspan class="red">[4/5] Simulating forged lockfile</tspan>
    </text>
    <text x="20" y="250">
      <tspan class="red">FORGERY DETECTED: .adversarial-lock.json does not match shadow lock.</tspan>
    </text>
    <text x="20" y="272">
      <tspan class="dim">Result: exited with code 1 (forgery detected)</tspan>
    </text>

    <!-- Step 5: Clean Pass -->
    <text x="0" y="310">
      <tspan class="green">[5/5] Restoring original suite and verifying</tspan>
    </text>
    <text x="20" y="332">
      <tspan class="white">Verified test/adversarial-skeptic.test.ts (11 tests, sha256 match).</tspan>
    </text>
    <text x="20" y="354">
      <tspan class="green">Verification passed: all tests passed without test tampering.</tspan>
    </text>
    <text x="20" y="376">
      <tspan class="dim">Unlocked test/adversarial-skeptic.test.ts. Lockfiles removed.</tspan>
    </text>
  </g>
</svg>
